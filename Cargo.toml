[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

# The shipped exe must stay under the 20 MB gate (issue #17). Optimising for size takes it
# from 23 MB to 15.4 MB; whole-program LTO in one codegen unit alone only reaches 19.8 MB.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# The screenshot tool: optimised, it renders one language and theme in 24 s on CI, against
# 217 s for a debug build. The debug assertions stay on.
[profile.screenshots]
inherits = "dev"
opt-level = 3
debug = false

# Unoptimised, the interpreter runs plugins about ten times slower, so a fuel allowance takes
# seconds in tests and debug builds instead of the milliseconds of a release.
[profile.dev.package.wasmi]
opt-level = 2

[profile.dev.package.wasmi_core]
opt-level = 2

[profile.dev.package.wasmi_ir]
opt-level = 2
