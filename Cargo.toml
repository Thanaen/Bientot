[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"

# The shipped exe must stay under the 20 MB gate (issue #17). Optimising for size takes it
# from 23 MB to 15.4 MB; whole-program LTO in one codegen unit alone only reaches 19.8 MB.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
