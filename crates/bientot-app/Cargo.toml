[package]
name = "bientot-app"
description = "WorkTime's GPUI shell: notification-area icon and windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "worktime"
path = "src/main.rs"

[[bin]]
name = "bientot-screenshots"
path = "src/bin/screenshots.rs"
required-features = ["screenshots"]

[features]
# Renders the flyout off screen to PNG files (software Vulkan on Linux CI).
screenshots = ["gpui/test-support", "gpui_platform/test-support", "dep:gpui_wgpu", "plugins"]
# Sends the anonymous daily usage signal over HTTPS from a release build. A debug build never
# sends, even with this feature on, and CI only measures the release build with `--data-dir`.
usage-ping = ["dep:ureq"]
# Updates the build Velopack installed, `Setup.exe`'s or the AppImage, from its feed
# (`platform/direct.rs`).
updates = ["dep:ureq", "dep:velopack"]
# Runs WebAssembly plugins (specs/003-plugin-runtime). Without it, nothing of the plugin host is
# compiled in.
plugins = ["dep:bientot-plugin-api", "dep:bientot-plugins"]
# The features of the Store package and the portable ZIP, whose updates do not go through
# Velopack. The notices generator reads the same feature.
release = ["usage-ping", "plugins"]
# The features of the Velopack Setup.exe and AppImage (scripts/release-direct.sh).
direct = ["release", "updates"]

[dependencies]
anyhow = "1"
# Channels from the plugins thread; gpui builds it anyway.
futures = "0.3"
gpui = { version = "=0.3.9", package = "gpui-pre" }
gpui_platform = { version = "=0.3.9", package = "gpui-pre-platform" }
image = { version = "0.25", default-features = false, features = ["png"] }
jiff = "1.0.0"
log = "0.4"
# Draws the tray icon at the taskbar's size; the version gpui already builds.
resvg = { version = "0.46", default-features = false }
rusqlite = "0.43.0"
serde_json = "1.0.154"
bientot-core = { path = "../bientot-core" }
bientot-domain = { path = "../bientot-domain" }
bientot-platform = { path = "../bientot-platform" }
bientot-plugin-api = { path = "../bientot-plugin-api", optional = true }
bientot-plugins = { path = "../bientot-plugins", optional = true }
bientot-store = { path = "../bientot-store" }
bientot-windows = { path = "../bientot-windows" }
# The updater of `Setup.exe` and of the AppImage (`platform/direct.rs`). `public-utils` names the
# manifest an update source receives.
velopack = { version = "=1.2.161", features = ["public-utils"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The tray and the flyout's placement (`platform::linux`); the other Linux ports are not wired yet.
bientot-linux = { path = "../bientot-linux" }
# Names the flyout's X11 window, which `bientot-linux` moves and focuses: the version GPUI builds.
raw-window-handle = "0.6"
# Without these backends GPUI runs its headless platform on Linux and opens no window. They link
# libxkbcommon and libxkbcommon-x11.
gpui_platform = { version = "=0.3.9", package = "gpui-pre-platform", features = ["wayland", "x11"] }
# Shapes text in the screenshots: GPUI's headless Linux platform has no text system.
gpui_wgpu = { version = "=0.3.9", package = "gpui-pre-wgpu", optional = true }

# Elsewhere than Windows, rustls with ring, statically linked, and the system's verifier
# (`platform::system_tls`): no OpenSSL to link or bundle. `rustls` also brings the Mozilla roots,
# which `RootCerts::PlatformVerifier` never reads.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "platform-verifier"], optional = true }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# SChannel. `native-tls` also brings the Mozilla roots (webpki-root-certs), which
# `RootCerts::PlatformVerifier` never reads, but ureq 3.4.2 compiles its native-tls connector only
# with this feature, not with `native-tls-no-default` alone.
ureq = { version = "3.4.2", default-features = false, features = ["native-tls"], optional = true }
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Already built for gpui's manifest; compiles the version resource with RC.EXE or llvm-rc.
embed-resource = "3.0.12"

[dev-dependencies]
roxmltree = "0.21.1"
tempfile = "3.27.0"

# The usage signal's test names the error that comes out of ureq's rustls.
[target.'cfg(not(windows))'.dev-dependencies]
rustls = { version = "0.23", default-features = false }

# The desktop harness reads where the flyout opens on X11 (tests/desktop_harness_flyout.rs).
[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = "0.13.2"
