[package]
name = "bientot-store"
description = "WorkTime persistence: settings.json and the SQLite ledger, compatible with the .NET files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
jiff = "0.2.38"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
bientot-domain = { path = "../bientot-domain" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
