[package]
name = "bientot-plugin-tool"
description = "Packs, signs and checks Bientôt plugins: the `bientot-plugin` command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "bientot-plugin"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "3.0.0", default-features = false }
getrandom = "0.4.3"
jiff = "0.2.38"
serde_json = "1.0.154"
bientot-plugin-api = { path = "../bientot-plugin-api" }
bientot-plugin-sdk = { path = "../bientot-plugin-sdk" }
bientot-plugins = { path = "../bientot-plugins" }

[dev-dependencies]
tempfile = "3.27.0"
wat = "1.263.0"
