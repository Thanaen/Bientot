[package]
name = "bientot-windows"
description = "Bientôt's Windows integration: the last-input query, the session and power message decoding, the power and session history, start with Windows, the single instance, notifications, the Store update call, the animation effects setting and the diagnostic export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
jiff = "1.0.0"
bientot-domain = { path = "../bientot-domain" }
bientot-platform = { path = "../bientot-platform" }
bientot-store = { path = "../bientot-store" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "ApplicationModel_Activation",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "Services_Store",
    "UI_Notifications",
    "Win32_System_Com",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# `#[implement]` expands to paths in `windows_core`, which `windows` re-exports as `windows::core`.
windows-core = "0.62.2"
windows-sys = { version = "0.61.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rusqlite = "0.43.0"
tempfile = "3.27.0"
