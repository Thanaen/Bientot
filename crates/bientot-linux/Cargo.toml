[package]
name = "bientot-linux"
description = "Bientôt's Linux integration. For now where the flyout opens, the tray icon and the flyout spike of Lot 4, the idle time, the session lock and the power from logind, the reminders as desktop notifications, the autostart entry, the single instance and the language of the messages (specs/005-linux-support); the rules stay platform independent and tested on any OS, and only the system calls behind them are Linux only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bientot-domain = { path = "../bientot-domain" }
bientot-platform = { path = "../bientot-platform" }

[target.'cfg(target_os = "linux")'.dependencies]
# The data folder whose instance key names the single instance's lock and socket.
bientot-store = { path = "../bientot-store" }
# logind and the screensaver (research.md, R7), on the zbus, async-io and futures-lite GPUI and
# ksni already build: the versions and features of the lock, no package added.
async-channel = "2.5.0"
async-io = "2.6.0"
futures-lite = "2.6.1"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
log = "0.4.35"
# The StatusNotifierItem tray (research.md, R4), on the zbus and async-io GPUI's portals already
# build, not on Tokio. `blocking` runs the item on a thread of its own.
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
# The version GPUI builds. `randr` names the monitors for the flyout's work area,
# `resource_manager` reads `Xft.dpi` as GPUI does for its scale, `screensaver` reads the idle time
# on X11.
x11rb = { version = "0.13.2", features = ["randr", "resource_manager", "screensaver"] }
# The idle time on Wayland (`ext_idle_notifier_v1`, in `staging`), the outputs' logical size
# (`xdg_output`, in `unstable`), the monotonic clock and the pidfd of the restart after an import:
# the versions and features async-io and GPUI already build.
rustix = { version = "1.1.6", features = ["event", "process", "time"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }

[dev-dependencies]
jiff = "1.0.0"
# The golden ledger test runs the Windows decoder, whose decoding half builds on any OS, beside
# the logind mapping (tests/golden_ledger.rs).
bientot-store = { path = "../bientot-store" }
bientot-windows = { path = "../bientot-windows" }
rusqlite = "0.43.0"
tempfile = "3.27.0"

# The spike (examples/shell-spike.rs) opens GPUI windows; nothing it uses is shipped.
[target.'cfg(target_os = "linux")'.dev-dependencies]
futures = "0.3"
gpui = { version = "=0.3.9", package = "gpui-pre" }
gpui_platform = { version = "=0.3.9", package = "gpui-pre-platform", features = ["wayland", "x11"] }
raw-window-handle = "0.6"
