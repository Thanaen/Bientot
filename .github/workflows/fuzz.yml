name: Fuzz

# Runs the cargo-fuzz targets of fuzz/ against the files Bientôt reads from disk: settings.json,
# transfer files, and the dates and instants of the ledger. See docs/ci-quality-gates.md.
on:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/bientot-domain/**"
      - "crates/bientot-store/**"
      - "Cargo.lock"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Every Sunday at 03:41 UTC, for longer than a pull request run.
    - cron: "41 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [codec, settings, transfer]
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The targets build against the dependency versions the app ships.
      - name: Use the workspace lock file
        run: cp Cargo.lock fuzz/Cargo.lock

      - name: Cache dependency builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}

      # After the cache step, which restores cargo-fuzz. cargo-fuzz needs nightly Rust for the
      # sanitizer flags; the app keeps its pinned toolchain.
      - name: Install nightly Rust and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --locked --version 0.13.2

      - name: Seed the corpus from the test fixtures
        run: fuzz/seed.sh

      - name: Fuzz
        working-directory: fuzz
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="$SECONDS_PER_TARGET"

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-artifacts
          path: fuzz/artifacts/
          retention-days: 30
