name: Store listing

# Reads the current Store submission of Bientôt (listing texts, images, package details) through
# the Store API and compares its listing texts with packaging/store/listing.json (#3). It also shows that the
# Partner Center secrets of the `release` environment work, without submitting anything. The
# logs of this public repository are public, so signed upload URLs are removed before the
# submission is printed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    name: Read
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release

    steps:
      - name: Install the Store CLI
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4

      - name: Read the submission
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        # pwsh decodes msstore's UTF-8 output with the console code page, which garbles accents.
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }
          msstore submission status 9N4FL1HRF4KL
          if ($LASTEXITCODE -ne 0) { throw "msstore submission status failed ($LASTEXITCODE)" }
          msstore submission get 9N4FL1HRF4KL | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'submission-raw.json')
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed ($LASTEXITCODE)" }

      # A shared access signature (`sig=`) lets anyone write to the submission's storage.
      - name: Remove signed URLs
        shell: bash
        run: |
          set -euo pipefail
          jq 'walk(if type == "string" and test("sig="; "i") then "<removed>" else . end)' \
            "$RUNNER_TEMP/submission-raw.json" > submission.json
          rm "$RUNNER_TEMP/submission-raw.json"
          cat submission.json

      - name: Checkout the listing
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          sparse-checkout: packaging/store
          sparse-checkout-cone-mode: false

      # The Store package workflow sends these texts with each submission, so a difference means
      # an edit made in Partner Center that the next submission would undo, or one in the
      # repository that is not submitted yet.
      - name: Compare with the repository
        shell: bash
        run: |
          set -euo pipefail
          jq -S --slurpfile listing repo/packaging/store/listing.json \
            '.Listings | with_entries(.value = (.value.BaseListing | with_entries(select(.key as $k | $listing[0] | any(.[]; has($k))))))' \
            submission.json > partner-center.json
          jq -S . repo/packaging/store/listing.json > repository.json
          if diff -u repository.json partner-center.json > listing.diff; then
            echo "The listing texts in Partner Center match packaging/store/listing.json." >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "The listing texts in Partner Center differ from packaging/store/listing.json:"; echo '```diff'; cat listing.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat listing.diff
          fi

      - name: Upload the submission
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-submission
          path: submission.json
          retention-days: 7
