name: Store package

# Builds the MSIX that goes to the Microsoft Store (#3), with the Partner Center identity of the
# manifest and an exe built for the Store channel, then submits it for certification. Every Monday
# when the app changed since the last submission, that is when a pull request added a user summary
# to scripts/release-summary/, or at once from the Actions tab. The submission waits for a reviewer
# of the `release` environment. Without the Store secrets of that environment it is skipped, and
# the `bientot-store-msix` artifact is uploaded in Partner Center › Packages by hand. The Store
# signs the package, so this one stays unsigned and Windows does not install it as is. Weekly, not
# nightly like the direct channel: each submission goes through certification before it reaches
# users. A submission replaces any draft started by hand in Partner Center, and sends the listing
# texts of packaging/store/listing.json with release notes made of those summaries.
on:
  schedule:
    # 05:17 UTC on Monday, after the nightly release of the direct channel.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the package to the Store
        type: boolean
        default: true

permissions:
  contents: read

# A run waiting for its reviewer holds the next one, which would submit the same commits again.
concurrency:
  group: store
  cancel-in-progress: false

jobs:
  # The last submission is the newest run of this workflow whose submit step succeeded. The
  # summaries added since make the release notes; without any, a scheduled run stops here.
  plan:
    name: Plan
    # Like release-direct.sh: only main ships, and a branch's commit count could exceed main's
    # and block its next submission.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read

    outputs:
      changed: ${{ steps.plan.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find the last submission
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fetched apart: a failing substitution in a `for` list would not stop the step.
          runs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/store-package.yml/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[] | "\(.id):\(.head_sha)"')
          since=""
          for run in $runs; do
            submitted=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}/jobs" \
              --jq '[.jobs[] | select(.name == "Submit") | .steps[] | select(.name == "Submit for certification" and .conclusion == "success")] | length')
            if ((submitted > 0)); then
              since=${run#*:}
              break
            fi
          done
          # Without it, the notes would gather every summary ever added.
          if [[ -z $since ]]; then
            echo "::error::No earlier run of this workflow submitted to the Store, so the release notes have no starting point."
            exit 1
          fi
          echo "since=$since" >> "$GITHUB_OUTPUT"

      - name: Write the listing
        id: plan
        env:
          SINCE: ${{ steps.last.outputs.since }}
        run: |
          set -euo pipefail
          scripts/store-release-notes.sh "$SINCE" "$GITHUB_SHA" > listing.json
          # The script keeps the file's release notes when no summary was added.
          if [[ $GITHUB_EVENT_NAME != schedule ]] || ! cmp -s <(jq -S . listing.json) <(jq -S . packaging/store/listing.json); then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "Release notes of the submission, from ${SINCE:-the first commit}:"; echo
              jq -r 'to_entries[] | "**\(.key)**\n\n\(.value.ReleaseNotes)\n"' listing.json; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to submit: no user summary was added since ${SINCE:-the first commit}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the listing
        if: ${{ steps.plan.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bientot-store-listing
          path: listing.json
          retention-days: 30
          if-no-files-found: error

  package:
    name: Package
    needs: plan
    if: ${{ needs.plan.outputs.changed == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60

    outputs:
      package: ${{ steps.version.outputs.package }}

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install

      # The Store takes four numbers and needs the last one at 0; each submission needs a higher
      # version than the last, which the commit count gives. The app shows the first three, like
      # the direct channel's build of the same commit. Windows' jq ends its output with CRLF.
      - name: Compute the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bientot-app") | .version' | tr -d '\r')
          count=$(git rev-list --count HEAD)
          IFS=. read -r major minor _ <<< "$base"
          echo "app=${major}.${minor}.${count}" >> "$GITHUB_OUTPUT"
          echo "package=${major}.${minor}.${count}.0" >> "$GITHUB_OUTPUT"
          echo "released=$(git log -1 --format=%cs HEAD)" >> "$GITHUB_OUTPUT"

      # The Store updates the app, so the exe has no Velopack updater.
      - name: Build the executable
        env:
          BIENTOT_CHANNEL: store
          BIENTOT_VERSION: ${{ steps.version.outputs.app }}
          BIENTOT_RELEASE_DATE: ${{ steps.version.outputs.released }}
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p bientot-app --bin worktime --features release

      - name: Package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'store'
          ./scripts/package-rust.ps1 -Exe target/release/worktime.exe -Channel store -OutDir $out -MaxSizeMB 20 `
            -Version '${{ steps.version.outputs.package }}'
          Rename-Item (Join-Path $out 'WorkTime-win-x64-unsigned.msix') "Bientot-${{ steps.version.outputs.package }}.msix"
          "Store package Bientot-${{ steps.version.outputs.package }}.msix" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bientot-store-msix
          path: ${{ runner.temp }}/store/*.msix
          retention-days: 30
          if-no-files-found: error

  # Apart from the build, so that only this job, behind the environment's reviewer, holds the
  # Partner Center credentials, and only in the steps that use them.
  submit:
    name: Submit
    needs: package
    # A scheduled run has no inputs.
    if: ${{ github.event_name == 'schedule' || inputs.submit }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check the Store secrets
        id: secrets
        shell: bash
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          missing=()
          for name in MSSTORE_TENANT_ID MSSTORE_CLIENT_ID MSSTORE_CLIENT_SECRET MSSTORE_SELLER_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not submitted: the \`release\` environment has no ${missing[*]}. Upload the \`bientot-store-msix\` artifact in Partner Center by hand." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download the listing
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bientot-store-listing
          path: store

      - name: Download the package
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bientot-store-msix
          path: store

      # `submission update --payload`, which reads the submission from a file, is in 0.4.3, not 0.4.0.
      - name: Install the Microsoft Store CLI
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
        with:
          version: v0.4.3

      # The Store ID of the listing: https://apps.microsoft.com/detail/9N4FL1HRF4KL
      - name: Submit for certification
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $package = Join-Path $PWD 'store/Bientot-${{ needs.package.outputs.package }}.msix'
          # The draft starts from the last published submission and gets the new package.
          msstore publish $package -id 9N4FL1HRF4KL --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)" }
          $draft = Join-Path $env:RUNNER_TEMP 'draft.json'
          msstore submission get 9N4FL1HRF4KL | Out-File -Encoding utf8 $draft
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed ($LASTEXITCODE)" }
          # The listing texts come from the Plan job; images and other fields stay as Partner Center
          # has them.
          $merged = Join-Path $env:RUNNER_TEMP 'submission.json'
          jq -c --slurpfile listing store/listing.json `
            '.Listings |= with_entries(.value.BaseListing += ($listing[0][.key] // {}))' $draft | Out-File -Encoding utf8 $merged
          if ($LASTEXITCODE -ne 0) { throw "jq failed ($LASTEXITCODE)" }
          # `submission update` prints the submission, signed upload URLs included, and the logs
          # of this public repository are public.
          msstore submission update 9N4FL1HRF4KL --payload $merged | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "msstore submission update failed ($LASTEXITCODE)" }
          msstore submission publish 9N4FL1HRF4KL
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed ($LASTEXITCODE)" }
          # `submission publish` returns once the commit starts; polling fails on a rejected one.
          msstore submission poll 9N4FL1HRF4KL
          if ($LASTEXITCODE -ne 0) { throw "msstore submission poll failed ($LASTEXITCODE)" }
          "Submitted Bientot-${{ needs.package.outputs.package }}.msix for certification, with the listing and release notes of the Plan job." >> $env:GITHUB_STEP_SUMMARY
