name: Store package

# Builds the MSIX that goes to the Microsoft Store (#3), with the Partner Center identity of the
# manifest and an exe built for the Store channel, then submits it for certification. Run it from
# the Actions tab: the submission waits for a reviewer of the `release` environment. Without the
# Store secrets of that environment it is skipped, and the `bientot-store-msix` artifact is
# uploaded in Partner Center › Packages by hand. The Store signs the package, so this one stays
# unsigned and Windows does not install it as is. Not nightly like the direct channel: each
# submission goes through certification before it reaches users. A submission replaces any draft
# started by hand in Partner Center, and sends the listing texts of packaging/store/listing.json.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the package to the Store
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    name: Package
    # Like release-direct.sh: only main ships, and a branch's commit count could exceed main's
    # and block its next submission.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 60

    outputs:
      package: ${{ steps.version.outputs.package }}

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install

      # The Store takes four numbers and needs the last one at 0; each submission needs a higher
      # version than the last, which the commit count gives. The app shows the same version as
      # the direct channel's build of this commit. Windows' jq ends its output with CRLF.
      - name: Compute the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bientot-app") | .version' | tr -d '\r')
          count=$(git rev-list --count HEAD)
          IFS=. read -r major minor _ <<< "$base"
          echo "app=${base}-alpha.${count}" >> "$GITHUB_OUTPUT"
          echo "package=${major}.${minor}.${count}.0" >> "$GITHUB_OUTPUT"
          echo "released=$(git log -1 --format=%cs HEAD)" >> "$GITHUB_OUTPUT"

      # The Store updates the app, so the exe has no Velopack updater.
      - name: Build the executable
        env:
          BIENTOT_CHANNEL: store
          BIENTOT_VERSION: ${{ steps.version.outputs.app }}
          BIENTOT_RELEASE_DATE: ${{ steps.version.outputs.released }}
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p bientot-app --bin worktime --features release

      - name: Package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'store'
          ./scripts/package-rust.ps1 -Exe target/release/worktime.exe -Channel store -OutDir $out -MaxSizeMB 20 `
            -Version '${{ steps.version.outputs.package }}'
          Rename-Item (Join-Path $out 'WorkTime-win-x64-unsigned.msix') "Bientot-${{ steps.version.outputs.package }}.msix"
          "Store package Bientot-${{ steps.version.outputs.package }}.msix" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: bientot-store-msix
          path: ${{ runner.temp }}/store/*.msix
          retention-days: 30
          if-no-files-found: error

  # Apart from the build, so that only this job, behind the environment's reviewer, holds the
  # Partner Center credentials, and only in the steps that use them.
  submit:
    name: Submit
    needs: package
    if: ${{ inputs.submit }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release

    steps:
      - name: Check the Store secrets
        id: secrets
        shell: bash
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          missing=()
          for name in MSSTORE_TENANT_ID MSSTORE_CLIENT_ID MSSTORE_CLIENT_SECRET MSSTORE_SELLER_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Not submitted: the \`release\` environment has no ${missing[*]}. Upload the \`bientot-store-msix\` artifact in Partner Center by hand." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout the listing
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: actions/checkout@v7
        with:
          sparse-checkout: packaging/store
          sparse-checkout-cone-mode: false

      - name: Download the package
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: bientot-store-msix
          path: store

      - name: Install the Microsoft Store CLI
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        uses: microsoft/microsoft-store-apppublisher@v1.4

      # The Store ID of the listing: https://apps.microsoft.com/detail/9N4FL1HRF4KL
      - name: Submit for certification
        if: ${{ steps.secrets.outputs.ready == 'true' }}
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
        run: |
          msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID `
            --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed ($LASTEXITCODE)" }
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new()
          $package = Join-Path $PWD 'store/Bientot-${{ needs.package.outputs.package }}.msix'
          # The draft starts from the last published submission and gets the new package.
          msstore publish $package -id 9N4FL1HRF4KL --noCommit
          if ($LASTEXITCODE -ne 0) { throw "msstore publish failed ($LASTEXITCODE)" }
          $draft = Join-Path $env:RUNNER_TEMP 'draft.json'
          msstore submission get 9N4FL1HRF4KL | Out-File -Encoding utf8 $draft
          if ($LASTEXITCODE -ne 0) { throw "msstore submission get failed ($LASTEXITCODE)" }
          # The listing texts come from packaging/store/listing.json; images and other fields stay
          # as Partner Center has them. `submission update` takes the whole submission as one
          # argument, which Windows limits to 32,767 characters.
          $submission = jq -c --slurpfile listing packaging/store/listing.json `
            '.Listings |= with_entries(.value.BaseListing += ($listing[0][.key] // {}))' $draft
          if ($LASTEXITCODE -ne 0) { throw "jq failed ($LASTEXITCODE)" }
          if ($submission.Length -gt 32000) { throw "The submission is $($submission.Length) characters, too long to pass to msstore" }
          msstore submission update 9N4FL1HRF4KL $submission
          if ($LASTEXITCODE -ne 0) { throw "msstore submission update failed ($LASTEXITCODE)" }
          msstore submission publish 9N4FL1HRF4KL
          if ($LASTEXITCODE -ne 0) { throw "msstore submission publish failed ($LASTEXITCODE)" }
          "Submitted Bientot-${{ needs.package.outputs.package }}.msix for certification, with the listing of packaging/store/listing.json." >> $env:GITHUB_STEP_SUMMARY
