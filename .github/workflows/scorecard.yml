name: Scorecard

# Scores the repository's security practices with OpenSSF Scorecard
# (https://scorecard.dev/viewer/?uri=github.com/Thanaen/Bientot), lists the failed checks as
# code scanning alerts, and publishes the score that the README badge shows. Scorecard's API
# accepts the published results only from a workflow without top-level env, defaults or write
# permissions, whose job runs only the actions below on an Ubuntu runner.
on:
  push:
    branches:
      - main
  schedule:
    # Every Monday at 05:23 UTC too, because a change to the repository settings pushes no commit.
    - cron: "23 5 * * 1"

permissions: read-all

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Uploads the results as code scanning alerts.
      security-events: write
      # Signs the published results.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scorecard publishes no major version tag, so the action is pinned to the commit of v2.5.0.
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
