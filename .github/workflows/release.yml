name: Release

# Publishes the "direct" channel: the Velopack Setup.exe and the update packages, as a GitHub
# Release of main. Every night when main has a commit without a release, or at once from the
# Actions tab for an urgent fix. Installed copies read the feed at https://worktime.thanaen.dev/
# updates/, which the service redirects to the release files.
on:
  schedule:
    # 04:17 UTC, before a working day in France.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Two runs would compute the same version and the second delta from a feed the first is changing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The version names main's commit: 0.2.0-alpha.<commit count>. A version with a release has
  # nothing new to publish.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      released: ${{ steps.released.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Compute the version
        id: version
        run: |
          set -euo pipefail
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "bientot-app") | .version')
          echo "version=${base}-alpha.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Look for its release
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A draft is a publication that stopped halfway: it is published again.
          draft=$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$draft" = false ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Bientôt ${VERSION} is already released: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Publishing Bientôt ${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build
    needs: plan
    if: ${{ needs.plan.outputs.released == 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      # The runner's Git checks out CRLF, which Bash cannot run and which would change the bits
      # that the files compiled into the exe give.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      # release-direct.sh checks that it builds origin/main as pushed: main may have moved since
      # the plan, and the version must name the planned commit.
      - name: Point origin/main at the planned commit
        shell: bash
        run: git update-ref refs/remotes/origin/main "${{ needs.plan.outputs.sha }}"

      - name: Install Rust toolchain
        run: rustup toolchain install

      # Its version must be the velopack crate's (crates/bientot-app/Cargo.toml): its Update.exe
      # installs the updates.
      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install --global vpk --version 1.2.161
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      # vpk computes the delta from the latest release, which it downloads from the feed.
      - name: Build the release
        shell: bash
        env:
          PYTHON: python
          RELEASE_NO_FETCH: "1"
        run: scripts/release-direct.sh "$(cygpath -u "$RUNNER_TEMP")/release"

      # The previous full package, downloaded for the delta, belongs to its own release. vpk names
      # the files after the packId, which stays Thanaen.WorkTime so that installed copies keep
      # updating; the downloads also go out under the app's name.
      - name: Keep this release's files
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          dist=$PWD/dist
          mkdir -p "$dist"
          cd "$(cygpath -u "$RUNNER_TEMP")/release"
          for file in *; do
            case "$file" in
              *.nupkg) [[ $file == *"-${VERSION}-"* ]] || continue ;;
            esac
            cp "$file" "$dist/"
          done
          cp Thanaen.WorkTime-win-Setup.exe "$dist/Bientot-Setup.exe"
          cp Thanaen.WorkTime-win-Portable.zip "$dist/Bientot-Portable.zip"
          ls -l "$dist"

      - name: Upload the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Apart from the build, so that only this job holds a token that can write to the repository.
  publish:
    name: Publish
    needs:
      - plan
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      # Sign the build provenance attestations with a Sigstore certificate and store them.
      id-token: write
      attestations: write

    steps:
      # The history from the previous release, for the notes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - name: Download the release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist

      # A signed SLSA build provenance attestation for each file, before the release lists it:
      # `gh attestation verify <file> --repo Thanaen/Bientot` checks that a workflow of this
      # repository built it. Windows and SmartScreen ignore it: it is not a code signature.
      - name: Attest the build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Add the attestation to the release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/Bientot.intoto.jsonl

      # A draft first: the release becomes the latest, whose feed installed copies read, only
      # once every package it lists is uploaded.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # GitHub's notes since the latest published release, without the pull requests that leave
          # the app as it is, after the announcements added since (scripts/release-notes.sh).
          previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" -f target_commitish="$SHA" \
            ${previous:+-f previous_tag_name="$previous"} --jq .body |
            scripts/release-notes.sh "$previous" "$SHA" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
            --title "Bientôt ${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published [Bientôt ${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})." >> "$GITHUB_STEP_SUMMARY"
