name: Release

# Publishes the "direct" channel: the Velopack Setup.exe and the update packages, as a GitHub
# Release of main. Every night when main has a commit without a release, or at once from the
# Actions tab for an urgent fix. Installed copies read the feed at https://worktime.thanaen.dev/
# updates/, which the service redirects to the release files.
on:
  schedule:
    # 04:17 UTC, before a working day in France.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Two runs would compute the same version and the second delta from a feed the first is changing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The version names main's commit: 0.2.0-alpha.<commit count>. A version with a release has
  # nothing new to publish.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      released: ${{ steps.released.outputs.released }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Compute the version
        id: version
        run: |
          set -euo pipefail
          base=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "worktime-app") | .version')
          echo "version=${base}-alpha.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Look for its release
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A draft is a publication that stopped halfway: it is published again.
          draft=$(gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$draft" = false ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "WorkTime ${VERSION} is already released: nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Publishing WorkTime ${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build
    needs: plan
    if: ${{ needs.plan.outputs.released == 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      # release-direct.sh checks that it builds origin/main as pushed: main may have moved since
      # the plan, and the version must name the planned commit.
      - name: Point origin/main at the planned commit
        shell: bash
        run: git update-ref refs/remotes/origin/main "${{ needs.plan.outputs.sha }}"

      - name: Install Rust toolchain
        run: rustup toolchain install

      # Its version must be the velopack crate's (crates/worktime-app/Cargo.toml): its Update.exe
      # installs the updates.
      - name: Install vpk
        shell: bash
        run: |
          dotnet tool install --global vpk --version 1.2.161
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      # vpk computes the delta from the latest release, which it downloads from the feed.
      - name: Build the release
        shell: bash
        env:
          PYTHON: python
          RELEASE_NO_FETCH: "1"
        run: scripts/release-direct.sh "$RUNNER_TEMP/release"

      # The previous full package, downloaded for the delta, belongs to its own release.
      - name: Keep this release's files
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd "$RUNNER_TEMP/release"
          for file in *; do
            case "$file" in
              *.nupkg) [[ $file == *"-${VERSION}-"* ]] || continue ;;
            esac
            cp "$file" "$GITHUB_WORKSPACE/dist/"
          done
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload the release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Apart from the build, so that only this job holds a token that can write to the repository.
  publish:
    name: Publish
    needs:
      - plan
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download the release
        uses: actions/download-artifact@v7
        with:
          name: release-${{ needs.plan.outputs.version }}
          path: dist

      # A draft first: the release becomes the latest, whose feed installed copies read, only
      # once every package it lists is uploaded.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$SHA" \
            --title "WorkTime ${VERSION}" --generate-notes
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" dist/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published [WorkTime ${VERSION}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})." >> "$GITHUB_STEP_SUMMARY"
