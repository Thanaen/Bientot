name: Bug report
description: Something in WorkTime does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. You can write in English or in French.
        For a security issue, do not open a public issue: follow [SECURITY.md](https://github.com/Thanaen/WorkTime/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what WorkTime did instead.
      placeholder: |
        1. I left my PC locked from 12:10 to 13:30.
        2. I expected the lunch break to be recorded.
        3. The flyout still counts that time as worked.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WorkTime version
      description: Shown under Settings › General › About.
      placeholder: 0.2.0-alpha.12
    validations:
      required: true
  - type: dropdown
    id: channel
    attributes:
      label: How you installed WorkTime
      options:
        - Installer (Setup.exe from worktime.thanaen.dev)
        - Microsoft Store
        - Portable ZIP
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Open Settings › System › About, or run `winver`.
      placeholder: Windows 11 24H2 (build 26100)
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - French
        - English
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or screenshots
      description: |
        If it helps, attach a diagnostics ZIP (tray menu › Export diagnostics…) or a screenshot.
        The ZIP contains no window titles, application names or secrets, but read it before you attach it to a public issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and found no report of this problem.
          required: true
